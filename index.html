    <script>
      // Safeguard for browser extensions attempting to assign window.fetch
      try {
        let _customFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _customFetch; },
          set: function(val) { _customFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (err) {}

      // Suppress third-party chrome extension runtime errors
      window.addEventListener('error', function(event) {
        if (event && event.filename && event.filename.indexOf('chrome-extension:') === 0) {
          event.stopImmediatePropagation();
        }
      });
    </script>
